<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="CloudVault 云文件管理界面截图">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b11" />
      <stop offset="1" stop-color="#0b0c13" />
    </linearGradient>
    <linearGradient id="c-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="c-thumb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="c-thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63" />
      <stop offset="1" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="c-thumb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95" />
      <stop offset="1" stop-color="#6d28d9" />
